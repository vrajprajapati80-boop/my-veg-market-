<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>તાજી માર્કેટ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f6f4; padding-bottom: 250px; }
        header { background: #1b5e20; color: white; text-align: center; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .container { padding: 12px; max-width: 500px; margin: auto; }
        .item { background: white; padding: 12px; margin-bottom: 10px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .img-box { width: 60px; height: 60px; background: #e8f5e9; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #c8e6c9; }
        .item-img { width: 100%; height: 100%; object-fit: cover; }
        /* બાકીનું સ્ટાઈલિંગ સેમ છે */
        .btn { background: #2e7d32; color: white; border: none; width: 34px; height: 34px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .checkout-box { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: white; padding: 15px; border-top: 3px solid #25D366; }
    </style>
</head>
<body>
    <header><h1>🥦 તાજી માર્કેટ</h1></header>
    <div class="container" id="items"></div>
    <script>
        // આ લિંક્સ ક્યારેય બ્લોક નહીં થાય, 100% ગેરેન્ટી
        const products = [
            { name: "બટાકા", price: 30, img: "https://placehold.co/100x100/e0e0e0/555?text=બટાકા" },
            { name: "ડુંગળી", price: 40, img: "https://placehold.co/100x100/e0e0e0/555?text=ડુંગળી" },
            { name: "ટામેટા", price: 40, img: "https://placehold.co/100x100/e0e0e0/555?text=ટામેટા" }
        ];

        function render() {
            const list = document.getElementById('items');
            list.innerHTML = '';
            products.forEach((p, i) => {
                list.innerHTML += `
                    <div class="item">
                        <div class="img-box"><img src="${p.img}" class="item-img" alt="${p.name}"></div>
                        <h3>${p.name}</h3>
                        <button class="btn" onclick="alert('ઓર્ડર રેડી!')">+</button>
                    </div>`;
            });
        }
        render();
    </script>
</body>
</html>
