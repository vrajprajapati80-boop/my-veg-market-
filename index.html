        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 90px; }
        header { background: #1b5e20; color: white; text-align: center; padding: 20px; position: sticky; top: 0; z-index: 100; }
        .container { padding: 10px; max-width: 500px; margin: 0 auto; }
        .section-title { font-size: 20px; color: #1b5e20; margin: 20px 0 10px 5px; font-weight: bold; border-bottom: 2px solid #1b5e20; padding-bottom: 5px; }
        .item { background: white; padding: 10px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item-left { display: flex; align-items: center; gap: 10px; }
        .item-img { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; }
        .item-info h3 { margin: 0; font-size: 15px; }
        .item-info p { margin: 2px 0 0; font-size: 13px; color: #555; }
        .btn-box { display: flex; align-items: center; }
        .btn { background: #2e7d32; color: white; border: none; width: 35px; height: 35px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .qty { margin: 0 12px; font-weight: bold; font-size: 16px; }
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-top: 2px solid #25D366; }
        .order-btn { background: #25D366; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>

            { name: "નાસપતિ", price: 120, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=120" },
            { name: "સ્ટ્રોબેરી", price: 100, unit: "250 ગ્રામ", img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=120" },
            { name: "કીવી", price: 30, unit: "1 નંગ", img: "https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=120" },
            { name: "સંતરા", price: 70, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1611080626939-61b99948a130?w=120" },
            { name: "ખારેક", price: 120, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1590080875960-9114d6935105?w=120" }
        ];

        let cart = {};
        function render() {
            const container = document.getElementById('items');
            container.innerHTML = '';
            products.forEach((p, i) => {
                if(p.price === 0) { container.innerHTML += `<div class="section-title">${p.name}</div>`; return; }
                const qty = cart[i] || 0;
                container.innerHTML += `
                    <div class="item">
                        <div class="item-left">
                            <img src="${p.img}" class="item-img">
                            <div class="item-info"><h3>${p.name}</h3><p>₹${p.price} / ${p.unit}</p></div>
                        </div>
                        <div class="btn-box">
                            <button class="btn" onclick="update(${i}, -1)">-</button>
                            <span class="qty">${qty}</span>
                            <button class="btn" onclick="update(${i}, 1)">+</button>
                        </div>
                    </div>`;
            });
            let total = 0;
            products.forEach((p, i) => total += (cart[i] || 0) * p.price);
            document.getElementById('total').innerText = total;
        }

        function update(i, c) { cart[i] = Math.max(0, (cart[i] || 0) + c); render(); }

        function sendOrder() {
            let total = 0, text = "નમસ્તે, મારો ઓર્ડર:%0A%0A";
            products.forEach((p, i) => {
                if (cart[i] > 0) {
                    let sub = cart[i] * p.price;
                    text += `• ${p.name}: ${cart[i]} x ₹${p.price} = ₹${sub}%0A`;
                    total += sub;
                }
            });
            if(total === 0) { alert("કંઈક સિલેક્ટ કરો!"); return; }
            text += `%0A-------------------%0A*કુલ રકમ: ₹${total}*%0A%0Aકૃપા કરીને મારો ઓર્ડર કન્ફર્મ કરો.`;
            window.open(`https://wa.me/919428707543?text=${text}`, '_blank');
        }
        render();
    </script>

</html>
