<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>તાજી માર્કેટ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7f4; padding-bottom: 90px; }
        header { background: #1b5e20; color: white; text-align: center; padding: 15px 10px 10px 10px; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0 0 10px 0; font-size: 20px; }
        .search-box { width: 92%; max-width: 460px; padding: 10px 14px; border-radius: 20px; border: none; font-size: 14px; outline: none; }
        .container { padding: 12px; max-width: 500px; margin: 0 auto; }
        .section-title { font-size: 18px; color: #1b5e20; margin: 20px 0 10px 0; font-weight: bold; border-bottom: 2.5px solid #2e7d32; padding-bottom: 4px; }
        .item { background: white; padding: 10px 12px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e8eee8; }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-img { width: 55px; height: 55px; object-fit: cover; border-radius: 10px; background: #e8f5e9; }
        .item-info h3 { margin: 0; font-size: 15px; color: #222; }
        .item-info p { margin: 3px 0 0; font-size: 13px; color: #666; font-weight: 500; }
        .btn-box { display: flex; align-items: center; background: #f0f7f0; border-radius: 8px; padding: 2px; }
        .btn { background: #2e7d32; color: white; border: none; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qty { margin: 0 10px; font-weight: bold; font-size: 15px; color: #1b5e20; min-width: 18px; text-align: center; }
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #25D366; }
        .total-box { font-size: 17px; color: #1b5e20; }
        .order-btn { background: #25D366; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>🥦 તાજી માર્કેટ 🍎</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 શોધો..." onkeyup="render()">
    </header>
    
    <div class="container" id="items"></div>
    
    <div class="footer">
        <div class="total-box">કુલ: <strong>₹<span id="total">0</span></strong></div>
        <button class="order-btn" onclick="sendOrder()">ઓર્ડર મોકલો 🛒</button>
    </div>

    <script>
        // અહીં GitHub પર અપલોડ કરેલી ફાઇલના નામ જ લખેલા છે
        const products = [
            { name: "🥦 મુખ્ય શાકભાજી", price: 0, unit: "", img: "" },
            { name: "બટાકા", price: 30, unit: "1 કિલો", img: "bataka.jpg" },
            { name: "ડુંગળી", price: 40, unit: "1 કિલો", img: "dungri.jpg" },
            { name: "ટામેટા", price: 40, unit: "1 કિલો", img: "tameta.jpg" },
            { name: "રીંગણ", price: 40, unit: "1 કિલો", img: "ringan.jpg" },
            { name: "ભીંડા", price: 60, unit: "1 કિલો", img: "bhinda.jpg" },
            { name: "દૂધી", price: 30, unit: "1 કિલો", img: "dudhi.jpg" },
            { name: "કાકડી", price: 40, unit: "1 કિલો", img: "kakdi.jpg" },
            { name: "કોબીજ", price: 30, unit: "1 કિલો", img: "kobij.jpg" },
            { name: "ફ્લાવર", price: 40, unit: "1 કિલો", img: "flower.jpg" },
            
            { name: "🍎 તાજા ફળો", price: 0, unit: "", img: "" },
            { name: "કેળા", price: 50, unit: "1 ડઝન", img: "kela.jpg" },
            { name: "સફરજન", price: 150, unit: "1 કિલો", img: "safarjan.jpg" },
            { name: "નારંગી", price: 80, unit: "1 કિલો", img: "narangi.jpg" },
            { name: "અનાનસ", price: 70, unit: "1 નંગ", img: "ananasa.jpg" },
            { name: "નાળિયેર", price: 40, unit: "1 નંગ", img: "naliyer.jpg" },
            { name: "જામફળ", price: 60, unit: "1 કિલો", img: "jamfal.jpg" }
        ];

        let cart = {};

        function render() {
            const container = document.getElementById('items');
            container.innerHTML = '';
            let query = document.getElementById('searchInput').value.toLowerCase().trim();

            products.forEach((p, i) => {
                if(p.price === 0) {
                    if(!query) container.innerHTML += `<div class="section-title">${p.name}</div>`;
                    return;
                }
                if(query && !p.name.toLowerCase().includes(query)) return;

                const qty = cart[i] || 0;
                container.innerHTML += `
                    <div class="item">
                        <div class="item-left">
                            <img src="${p.img}" class="item-img" onerror="this.src='https://via.placeholder.com/100?text=${encodeURIComponent(p.name)}';">
                            <div class="item-info">
                                <h3>${p.name}</h3>
                                <p>₹${p.price} / ${p.unit}</p>
                            </div>
                        </div>
                        <div class="btn-box">
                            <button class="btn" onclick="update(${i}, -1)">-</button>
                            <span class="qty">${qty}</span>
                            <button class="btn" onclick="update(${i}, 1)">+</button>
                        </div>
                    </div>`;
            });
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            products.forEach((p, i) => total += (cart[i] || 0) * p.price);
            document.getElementById('total').innerText = total;
        }

        function update(i, c) {
            cart[i] = Math.max(0, (cart[i] || 0) + c);
            render();
        }

        function sendOrder() {
            let total = 0, itemsList = "", count = 0;
            products.forEach((p, i) => {
                if (cart[i] > 0) {
                    count++;
                    let sub = cart[i] * p.price;
                    itemsList += `${count}. *${p.name}* (${p.unit}) - ${cart[i]} × ₹${p.price} = ₹${sub}\n`;
                    total += sub;
                }
            });
            if(count === 0) return alert("વસ્તુ પસંદ કરો!");
            
            let msg = `🛒 *નવો ઓર્ડર*\n\n${itemsList}\n💰 *કુલ: ₹${total}*`;
            window.open(`https://wa.me/919428707543?text=${encodeURIComponent(msg)}`, '_blank');
        }

        render();
    </script>
</body>
</html>
