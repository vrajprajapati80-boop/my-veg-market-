    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7f4; padding-bottom: 90px; }
        header { background: #1b5e20; color: white; text-align: center; padding: 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        header h1 { margin: 0; font-size: 22px; }
        .container { padding: 12px; max-width: 500px; margin: 0 auto; }
        .section-title { font-size: 19px; color: #1b5e20; margin: 20px 0 10px 0; font-weight: bold; border-bottom: 2.5px solid #2e7d32; padding-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .item { background: white; padding: 10px 14px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #e8eee8; }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-img { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; background: #e8f5e9; border: 1px solid #c8e6c9; }
        .item-info h3 { margin: 0; font-size: 15px; color: #222; }
        .item-info p { margin: 3px 0 0; font-size: 13px; color: #666; font-weight: 500; }
        .btn-box { display: flex; align-items: center; background: #f0f7f0; border-radius: 8px; padding: 2px; }
        .btn { background: #2e7d32; color: white; border: none; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn:active { background: #1b5e20; }
        .qty { margin: 0 10px; font-weight: bold; font-size: 15px; color: #1b5e20; min-width: 18px; text-align: center; }
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-top: 2px solid #25D366; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); }
        .total-box { font-size: 17px; color: #1b5e20; }
        .order-btn { background: #25D366; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 3px 6px rgba(37,211,102,0.3); }
        .order-btn:active { background: #1eb954; }
    </style>
</head>

            { name: "જામફળ", price: 60, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1536511158945-13b7d6928e46?w=150" },
            { name: "દ્રાક્ષ", price: 100, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=150" },
            { name: "કાળી દ્રાક્ષ", price: 120, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1596363705765-a8597379774b?w=150" },

            { name: "મોસંબી", price: 80, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1557800636-894a64c1696f?w=150" },

            { name: "સ્ટ્રોબેરી", price: 100, unit: "250 ગ્રામ", img: "https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=150" },
            { name: "કીવી", price: 30, unit: "1 નંગ", img: "https://images.unsplash.com/photo-1585059819970-313832b401e1?w=150" },
            { name: "સંતરા", price: 70, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1611080626939-61b99948a130?w=150" },
            { name: "ખારેક", price: 120, unit: "1 કિલો", img: "https://images.unsplash.com/photo-1590080875960-9114d6935105?w=150" }
        ];

        let cart = {};

        function render() {
            const container = document.getElementById('items');
            container.innerHTML = '';
            products.forEach((p, i) => {
                if(p.price === 0) {
                    container.innerHTML += `<div class="section-title">${p.name}</div>`;
                    return;
                }
                const qty = cart[i] || 0;
                container.innerHTML += `
                    <div class="item">
                        <div class="item-left">
                            <img src="${p.img}" class="item-img" onerror="this.onerror=null; this.src='${fallbackImg}';">
                            <div class="item-info">
                                <h3>${p.name}</h3>
                                <p>₹${p.price} / ${p.unit}</p>
                            </div>
                        </div>
                        <div class="btn-box">
                            <button class="btn" onclick="update(${i}, -1)">-</button>
                            <span class="qty">${qty}</span>
                            <button class="btn" onclick="update(${i}, 1)">+</button>
                        </div>
                    </div>`;
            });
            
            let total = 0;
            products.forEach((p, i) => total += (cart[i] || 0) * p.price);
            document.getElementById('total').innerText = total;
        }

        function update(i, c) {
            cart[i] = Math.max(0, (cart[i] || 0) + c);
            render();
        }

        function sendOrder() {
            let total = 0;
            let itemsList = "";
            let count = 0;

            products.forEach((p, i) => {
                if (cart[i] > 0) {
                    count++;
                    let sub = cart[i] * p.price;
                    itemsList += `${count}. *${p.name}* (${p.unit})\n    └ જથ્થો: *${cart[i]}* × ₹${p.price} = *₹${sub}*\n\n`;
                    total += sub;
                }
            });

            if(count === 0) {
                alert("કૃપા કરીને ઓર્ડર કરવા માટે ઓછામાં ઓછી એક વસ્તુ પસંદ કરો!");
                return;
            }

            let today = new Date();
            let dateStr = today.toLocaleDateString('gu-IN', { day: 'numeric', month: 'short', year: 'numeric' });

            let msg = `🛒 *નવો ઓર્ડર - તાજી માર્કેટ* 🛒\n`;
            msg += `📅 *તારીખ:* ${dateStr}\n`;
            msg += `------------------------------------\n\n`;
            msg += `📋 *ઓર્ડરની વિગત (${count} આઇટમ):*\n\n${itemsList}`;
            msg += `------------------------------------\n`;
            msg += `💰 *કુલ ચૂકવવાપાત્ર રકમ: ₹${total}*\n`;
            msg += `------------------------------------\n\n`;
            msg += `🚚 *મહેરબાની કરીને મારો ઓર્ડર કન્ફર્મ કરશો.*`;

            let encodedMsg = encodeURIComponent(msg);
            window.open(`https://wa.me/9196237985?text=${encodedMsg}`, '_blank');
        }

        render();
    </script>
</body>
</html>
